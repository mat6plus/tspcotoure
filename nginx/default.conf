map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Main site
server {
    listen 8000;
    server_name tspcouture.com www.tspcouture.com;

    client_max_body_size 50M;

    location /static/ {
        alias /app/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/backend/media/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /cms-admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        root /app/rom_couture_final;
        index index.html;
        try_files $uri $uri/ $uri.html /index.html =404;
    }
}

# Admin subdomain — serves CMS admin at root without /cms-admin/ prefix
server {
    listen 8000;
    server_name admin.tspcouture.com;

    client_max_body_size 50M;

    location /static/ {
        alias /app/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/backend/media/;
    }

    # Handle /cms-admin/ paths directly (for Django-generated URLs in redirects)
    location /cms-admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Accept-Encoding "";
        proxy_redirect /cms-admin/ /;
        sub_filter '/cms-admin/' '/';
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
    }

    # Proxy root to Django's /cms-admin/ with path rewriting
    location / {
        proxy_pass http://127.0.0.1:8001/cms-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Accept-Encoding "";
        proxy_redirect /cms-admin/ /;
        sub_filter '/cms-admin/' '/';
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
    }
}
