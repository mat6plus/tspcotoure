map $http_x_forwarded_proto $real_proto {
    https  https;
    http   http;
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Force port 443 for HTTPS, 80 for HTTP — prevents :8000 leaking into URLs
map $http_x_forwarded_proto $real_port {
    https  443;
    http   80;
    default $http_x_forwarded_port;
    ""      $server_port;
}

# Main site — frontend + API
server {
    listen 8000;
    server_name tspcouture.com www.tspcouture.com;

    client_max_body_size 50M;

    location /static/ {
        alias /app/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/backend/media/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_set_header X-Forwarded-Port $real_port;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_set_header X-Forwarded-Port $real_port;
    }

    location /cms-admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_set_header X-Forwarded-Port $real_port;
    }

    location / {
        root /app/rom_couture_final;
        index index.html;
        try_files $uri $uri/ $uri.html /index.html =404;
    }
}

# Admin subdomain — redirects to /cms-admin/
server {
    listen 8000;
    server_name admin.tspcouture.com;

    client_max_body_size 50M;

    location /static/ {
