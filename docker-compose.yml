version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: romcouture
      POSTGRES_USER: romcouture
      POSTGRES_PASSWORD: ${DB_PASSWORD:-romcouture_prod_pass_change_this}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romcouture"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    expose:
      - "8000"
    volumes:
      - ./backend/media:/app/backend/media
    environment:
      DJANGO_SECRET_KEY: 2ytSfvZjUunYeuw3Po-kkHat86yQiumsUOTpKdIC40fXRvnNUJw5nxlR_RcFU9bvwv0
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "tspcouture.com,www.tspcouture.com,admin.tspcouture.com"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: romcouture
      DB_USER: romcouture
      DB_PASSWORD: ${DB_PASSWORD:-romcouture_prod_pass_change_this}
      DB_HOST: db
      DB_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST: smtp.sendgrid.net
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: apikey
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: "True"
      DEFAULT_FROM_EMAIL: bespoke@romcouture.com
      ADMIN_EMAIL: owner@romcouture.com
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      SECURE_HSTS_PRELOAD: "True"
      CSRF_TRUSTED_ORIGINS: "https://tspcouture.com,https://www.tspcouture.com,https://admin.tspcouture.com"
      CSRF_COOKIE_DOMAIN: .tspcouture.com
      SESSION_COOKIE_DOMAIN: .tspcouture.com
      DJANGO_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
